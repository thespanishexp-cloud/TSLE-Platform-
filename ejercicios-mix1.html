<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mezcla de Tiempos 1 | TSLE</title>
<style>
:root{--red:#EE3535;--navy:#0B4A7C;--nlight:#1c5fa0;--bg:#F7F8FC;--white:#fff;--bdr:#D0D8E8;--ok:#2e7d32;--okbg:#e8f5e9;--no:#c62828;--nobg:#ffebee;--muted:#6b7a99;--sh:0 2px 12px rgba(27,58,107,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;}
.wrap{max-width:820px;margin:0 auto;padding:20px;}
.back-link{display:inline-block;margin-bottom:14px;color:var(--navy);text-decoration:none;font-size:.9rem;font-weight:600;}
header{background:var(--navy);color:#fff;padding:22px 24px;border-radius:12px 12px 0 0;}
header img{max-width:150px;height:auto;margin-bottom:10px;display:block;}
header h1{font-size:1.35rem;margin-bottom:4px;}
header p{font-size:.9rem;opacity:.85;}
.vocab-section{background:#fff;box-shadow:var(--sh);padding:18px 24px;border-radius:0 0 12px 12px;margin-bottom:24px;}
.vocab-section h2{font-size:1.05rem;color:var(--navy);margin-bottom:10px;}
.vocab-line{font-size:.87rem;line-height:1.9;color:#333;}
.vocab-line strong{color:var(--navy);}
.story-section{background:#fff;border-radius:12px;box-shadow:var(--sh);margin-bottom:20px;}
.story-header{background:var(--red);color:#fff;padding:18px 24px;border-radius:12px 12px 0 0;}
.story-header h2{margin:0 0 4px;font-size:1.15rem;}
.story-header p{margin:0;font-size:.85rem;opacity:.9;}
.story-body{padding:24px;}
.story-text{font-size:1.03rem;line-height:2.5;}
.story-select{font-size:.9rem;font-weight:700;color:var(--navy);background:#eef1f8;border:2px solid var(--nlight);border-radius:6px;padding:4px 8px;margin:0 4px;cursor:pointer;}
.story-select.correct{border-color:var(--ok);background:var(--okbg);color:var(--ok);}
.story-select.incorrect{border-color:var(--no);background:var(--nobg);color:var(--no);}
.story-score{margin:0 24px 20px;padding:10px 16px;border-radius:8px;background:var(--bg);font-weight:700;color:var(--navy);display:none;}
.story-score.show{display:block;}
.story-actions{padding:0 24px 24px;display:flex;gap:12px;flex-wrap:wrap;}
.btn-all{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:700;cursor:pointer;}
.btn-rst{background:transparent;color:var(--navy);border:2px solid var(--bdr);border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:700;cursor:pointer;}
.brand-footer{text-align:center;margin-top:18px;color:#8a8f9c;font-size:.8rem;}
</style>
</head>
<body>
<div class="wrap">
<a class="back-link" href="s8.html">&larr; Volver a Español 8</a>

<header>
  <img src="logo-tsle.png" alt="The Spanish Learning Experience">
  <h1>Mezcla de Tiempos 1</h1>
  <p>Historia larga combinando todos los tiempos verbales</p>
</header>

<div class="vocab-section">
  <h2>Vocabulario clave</h2>
  <div id="vocab-list"></div>
</div>

<div class="story-section">
  <div class="story-header">
    <h2>El festival del pueblo</h2>
    <p>Elige el tiempo verbal correcto en cada menú desplegable</p>
  </div>
  <div class="story-body">
    <div class="story-text" id="story-container"></div>
  </div>
  <div class="story-score" id="story-score-bar"></div>
  <div class="story-actions">
    <button class="btn-all" onclick="checkStory()">Verificar historia</button>
    <button class="btn-rst" onclick="resetStory()">Reiniciar historia</button>
  </div>
</div>

<div class="brand-footer">TSLE · The Spanish Learning Experience</div>
</div>

<script>
function normalize(s){return s.trim().toLowerCase().replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u');}

var vocab = [
  ["el festival","the festival"],
  ["el desfile","the parade"],
  ["los fuegos artificiales","fireworks"],
  ["el puesto (de comida)","the food stand"],
  ["la banda","the band"],
  ["el escenario","the stage"],
  ["el orgullo","pride"],
  ["reunirse","to gather, get together"],
  ["celebrar","to celebrate"],
  ["la tradición","the tradition"]
];

function renderVocab(){
  var el = document.getElementById("vocab-list");
  el.innerHTML = vocab.map(function(v){
    return "<div class='vocab-line'><strong>" + v[0] + "</strong> — " + v[1] + "</div>";
  }).join("");
}

// opts: array de formas conjugadas del mismo verbo en distintos tiempos
// correct: índice de la forma correcta
var story = [
  {text:"Cada año, mi pueblo "},
  {opts:["celebra","celebró","celebrará"], correct:0},
  {text:" un festival muy especial en el mes de agosto. Cuando yo "},
  {opts:["soy","era","fui"], correct:1},
  {text:" niño, siempre "},
  {opts:["voy","fui","iba"], correct:2},
  {text:" con mis abuelos a ver el desfile. Recuerdo que un año, la banda "},
  {opts:["toca","tocó","tocaba"], correct:1},
  {text:" una canción tan alegre que todo el pueblo "},
  {opts:["baila","bailó","bailaba"], correct:1},
  {text:" en la calle principal. Hoy en día, yo también "},
  {opts:["voy","fui","iré"], correct:0},
  {text:" cada año, porque para mí "},
  {opts:["es","fue","era"], correct:0},
  {text:" una tradición muy importante. El año pasado, mis amigos y yo "},
  {opts:["llegamos","llegábamos","llegaremos"], correct:0},
  {text:" temprano para conseguir un buen lugar cerca del escenario. Nosotros "},
  {opts:["comimos","comíamos","comeremos"], correct:0},
  {text:" elote y tacos de varios puestos de comida. Mientras nosotros "},
  {opts:["comemos","comíamos","comimos"], correct:1},
  {text:" el festival "},
  {opts:["empieza","empezó","empezaba"], correct:1},
  {text:" oficialmente con un discurso del alcalde. Este año, mis padres me dijeron que ellos "},
  {opts:["han asistido","asisten","asistirán"], correct:2},
  {text:" también, algo que no hacen desde hace mucho tiempo. Yo "},
  {opts:["he ido","voy","iré"], correct:0},
  {text:" al festival muchas veces en mi vida, pero cada año "},
  {opts:["es","fue","era"], correct:0},
  {text:" diferente y especial. Espero que este año todos nosotros "},
  {opts:["nos divirtamos","nos divertimos","nos divertiremos"], correct:0},
  {text:" mucho juntos. Mi abuela siempre me dice: \"" },
  {opts:["Disfruta","Disfrutas","Disfrutarás"], correct:0},
  {text:" cada momento, porque estos recuerdos "},
  {opts:["duran","duraron","durarán"], correct:2},
  {text:" para siempre.\" Ella tiene razón. El próximo fin de semana, toda mi familia "},
  {opts:["se reúne","se reunió","se reunirá"], correct:2},
  {text:" para ver los fuegos artificiales juntos, como "},
  {opts:["hacemos","hicimos","hacíamos"], correct:2},
  {text:" siempre desde que yo era pequeño. Mi hermana "},
  {opts:["ha preparado","prepara","preparará"], correct:0},
  {text:" ya toda la comida para ese día, y está muy emocionada. Cuando los fuegos artificiales "},
  {opts:["empiezan","empezaron","empezarán"], correct:2},
  {text:" el próximo sábado, toda la plaza "},
  {opts:["se llena","se llenó","se llenará"], correct:2},
  {text:" de luces de colores. Es un momento que siempre "},
  {opts:["llena","llenó","llenaba"], correct:0},
  {text:" mi corazón de alegría y orgullo por mi comunidad. Ojalá que las próximas generaciones también "},
  {opts:["disfruten","disfrutan","disfrutarán"], correct:0},
  {text:" de esta hermosa tradición durante muchos años más."}
];

function renderStory(){
  var container = document.getElementById("story-container");
  container.innerHTML = "";
  var blankIndex = 0;
  story.forEach(function(item){
    if(item.text !== undefined){
      var span = document.createElement("span");
      span.textContent = item.text;
      container.appendChild(span);
    } else {
      var sel = document.createElement("select");
      sel.className = "story-select";
      sel.id = "blank-" + blankIndex;
      var def = document.createElement("option");
      def.value = ""; def.textContent = "- elige -";
      sel.appendChild(def);
      item.opts.forEach(function(opt, oi){
        var o = document.createElement("option");
        o.value = oi;
        o.textContent = opt;
        sel.appendChild(o);
      });
      container.appendChild(sel);
      blankIndex++;
    }
  });
  document.getElementById("story-score-bar").className = "story-score";
  document.getElementById("story-score-bar").innerHTML = "";
}

var blankItems = story.filter(function(i){ return i.opts !== undefined; });

function checkStory(){
  var correct = 0, total = blankItems.length, answered = 0;
  for(var i = 0; i < total; i++){
    var sel = document.getElementById("blank-" + i);
    sel.classList.remove("correct","incorrect");
    if(sel.value === "") continue;
    answered++;
    if(parseInt(sel.value,10) === blankItems[i].correct){
      sel.classList.add("correct");
      correct++;
    } else {
      sel.classList.add("incorrect");
    }
  }
  var bar = document.getElementById("story-score-bar");
  bar.className = "story-score show";
  var pct = Math.round(correct / total * 100);
  bar.textContent = "Resultado: " + correct + " / " + total + " correctas (" + pct + "%). Respondidas: " + answered + " de " + total + ".";
}

function resetStory(){ renderStory(); }

renderVocab();
renderStory();
</script>
</body>
</html>
